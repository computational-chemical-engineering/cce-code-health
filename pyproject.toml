[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cce-code-health"
dynamic = ["version"]
description = "Code-health metrics, CI ratchet and tooling for a behaviour-preserving agentic refactor loop (experimental)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# complexipy is pinned: profile python@0 is frozen, and complexipy 9 scores cognitive complexity
# differently (pymrm coupling.py: 91.9 under 8.3.0, 43.9 under 9.0.0). A new major goes with a new profile.
dependencies = ["complexipy==8.3.0"]

[project.optional-dependencies]
# lizard pinned for profile cpp@0 (dem and flow baselines were scored with 1.26.0)
cpp = ["lizard==1.26.0"]
test = ["pytest", "coverage", "numpy", "lizard==1.26.0"]

[project.scripts]
codehealth = "cce_code_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version from git: tags give releases, other commits 0.x.(y+1).devN+g<sha>, so a re-pin
# to another commit is always a different version for pip.
