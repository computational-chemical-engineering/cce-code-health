[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cce-code-health"
dynamic = ["version"]
description = "Code-health metrics, CI ratchet and tooling for a behaviour-preserving agentic refactor loop (experimental)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["complexipy>=8"]

[project.optional-dependencies]
test = ["pytest", "coverage"]

[project.scripts]
codehealth = "cce_code_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version from git: tags give releases, other commits 0.x.(y+1).devN+g<sha>, so a re-pin
# to another commit is always a different version for pip.
